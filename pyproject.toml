[tool.uv.workspace]
members = ["packages/*"]

[tool.pyright]
typeCheckingMode = "strict"
executionEnvironments = [
    { root = "packages/claude-with-the-anthropic-api/tests", extraPaths = ["packages/claude-with-the-anthropic-api/src"] },
]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=8.3.0",
    "ruff>=0.14.0",
]
